# Lint and build gate for `main`.
#
# This file used to also deploy production: it rsynced the Next.js standalone
# build output over SSH to `secrets.SERVER_USER@secrets.SERVER_HOST` and
# restarted PM2 there. That host no longer serves production — the waitlist
# site now runs as a container on the shared EC2 box, reconciled over SSM — and
# the identical dev job has been failing at its first SSH step since
# 2026-09-11. The deploy job has been removed, along with the `rsync --delete`
# that would mirror the build output over a live deployment path if
# `SERVER_HOST` were ever repointed at the current box.
#
# Production deploys are to be made by `deploy-production.yml`, a manual
# (`workflow_dispatch`) caller of the shared storytime-devops pipeline. That
# file is not merged yet — it is open as PR #171 — and it also needs a
# Dockerfile on `main`, build-arg support in the shared pipeline (devops PR
# #20) and a copy on the default branch (`dev`) before `workflow_dispatch` will
# register it. So `main` has no automated production deploy path in the
# interim; the running container is unaffected.
name: CI Frontend (main)

on:
  pull_request:
    branches:
      - main # Lint and build on PR to main
  push:
    branches:
      - main # Re-check the merged result on main
  workflow_dispatch: # Allow manual re-run

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run lint
        run: pnpm lint

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 9

      - name: Create synthetic .env (no real secrets in pre-merge CI)
        run: |
          cat > .env << 'EOF'
          NODE_ENV=production
          NEXT_PUBLIC_SERVER_URL=http://localhost:3000
          NEXT_PUBLIC_SENTRY_DSN=
          NEXT_PUBLIC_SENTRY_ENVIRONMENT=ci
          NEXT_PUBLIC_META_PIXEL_ID=
          EOF

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build frontend
        run: pnpm build

